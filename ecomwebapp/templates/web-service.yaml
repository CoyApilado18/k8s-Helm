apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.service.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: ecom-webapp
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.service.targetPort }}
      protocol: TCP
  selector:
    app: ecom-webapp
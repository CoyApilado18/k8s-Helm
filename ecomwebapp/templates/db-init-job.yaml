apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init-{{ .Release.Revision }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: db-init
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: {{ .Values.init.backoffLimit }}
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: "{{ .Values.init.image.repository }}:{{ .Values.init.image.tag }}"
          imagePullPolicy: {{ .Values.init.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for database..."
              until mysqladmin ping \
                -h"${DB_HOST}" \
                -u"${DB_USER}" \
                -p"${DB_PASSWORD}" \
                --silent; do
                sleep 2
              done

              echo "Running db-load-script.sql..."
              mysql \
                -h"${DB_HOST}" \
                -u"${DB_USER}" \
                -p"${DB_PASSWORD}" \
                "${DB_NAME}" < /scripts/db-load-script.sql
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.appConfig.name }}
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.appConfig.name }}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: password
          volumeMounts:
            - name: db-init-script
              mountPath: /scripts/db-load-script.sql
              subPath: db-load-script.sql
              readOnly: true
      volumes:
        - name: db-init-script
          configMap:
            name: {{ .Values.init.configMapName }}
            items:
              - key: db-load-script.sql
                path: db-load-script.sql
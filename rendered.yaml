---
# Source: ecomwebapp/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: helm
---
# Source: ecomwebapp/templates/db-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: helm
type: Opaque
stringData:
  username: "ecomuser"
  password: "ecompassword"
  rootpassword: "ecomrootpassword"
---
# Source: ecomwebapp/templates/db-app-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: helm
data:
  DB_HOST: "mariadb-service.helm.svc.cluster.local"
  DB_NAME: "ecomdb"
  FEATURE_DARK_MODE: "false"
---
# Source: ecomwebapp/templates/db-init-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-cm
  namespace: helm
data:
  db-load-script.sql: |

    CREATE DATABASE IF NOT EXISTS ecomdb;
    USE ecomdb;
    
    CREATE TABLE IF NOT EXISTS Products (
      id MEDIUMINT(8) UNSIGNED NOT NULL AUTO_INCREMENT,
      Name VARCHAR(255) DEFAULT NULL,
      Price VARCHAR(255) DEFAULT NULL,
      ImageUrl VARCHAR(255) DEFAULT NULL,
      PRIMARY KEY (id),
      UNIQUE KEY uq_products_name_imageurl (Name, ImageUrl)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
    
    INSERT INTO Products (Name, Price, ImageUrl)
    VALUES
      ('Laptop', '100', 'c-1.png'),
      ('Drone', '200', 'c-2.png'),
      ('VR', '300', 'c-3.png'),
      ('Tablet', '50', 'c-5.png'),
      ('Watch', '90', 'c-6.png'),
      ('Phone Covers', '20', 'c-7.png'),
      ('Phone', '80', 'c-8.png'),
      ('Laptop', '150', 'c-4.png')
    ON DUPLICATE KEY UPDATE
      Price = VALUES(Price),
      ImageUrl = VALUES(ImageUrl);
---
# Source: ecomwebapp/templates/db-pv-pvc.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv1
spec:
  capacity:
    storage: 2Gi
  accessModes:

    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mysql
---
# Source: ecomwebapp/templates/db-pv-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc1
  namespace: helm
spec:
  accessModes:

    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
---
# Source: ecomwebapp/templates/db-mariadb-service.yaml
apiVersion: v1
